<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Գիտելիքների Մենամարտ — Խմբագրիչ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&family=Noto+Serif+Armenian:wght@600;700&family=Arial&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121f;--panel:#1e1b30;--panel2:#262242;--gold:#e8b23d;--teal:#4fd1c5;--ink:#f2efea;--muted:#9b96b3;--used:#2a2740;--sans:'Noto Sans Armenian',sans-serif;--serif:'Noto Serif Armenian',serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#241f3d 0%,var(--bg) 55%);color:var(--ink);font-family:var(--sans);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(20px,calc((100% - 1200px)/2));background:#171426ed;border-bottom:1px solid #332f52;backdrop-filter:blur(12px)}.brand{font-weight:800;color:var(--gold)}.actions,.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #454064;background:var(--panel2);color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:700}.btn:hover{border-color:var(--gold);filter:brightness(1.08)}.btn.primary{background:var(--gold);color:#241a08;border-color:var(--gold)}.btn.danger{color:#ff9d9d}.wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab.active{background:var(--gold);color:#241a08;border-color:var(--gold)}.panel{background:var(--panel);border:1px solid #332f52;border-radius:14px;padding:20px;margin-bottom:18px}.panel h2,.panel h3{margin-top:0}.field{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:600}.field input,.field textarea,.field select{width:100%;background:#14121f;border:1px solid #403b60;color:var(--ink);border-radius:8px;padding:10px 12px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--gold)}.field textarea{min-height:78px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.phase-head{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:12px;align-items:end}.phase-card{border:1px solid #393552;border-radius:12px;margin:14px 0;overflow:hidden}.phase-title{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#242139;padding:14px 16px}.phase-title h3{margin:0}.question-list{padding:12px}.q-card{background:#171526;border:1px solid #383450;border-radius:10px;padding:14px;margin:10px 0}.q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--gold);font-weight:700}.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:14px}.color-field{display:flex;align-items:center;gap:10px}.color-field input{height:42px;padding:3px;width:58px}.hidden{display:none!important}.game-wrap{max-width:1100px;margin:auto;padding:34px 20px}.game-head{border-bottom:1px solid #332f52;padding-bottom:16px;margin-bottom:26px}.game-head h1{font:700 clamp(28px,4vw,42px) var(--serif);color:var(--gold);margin:0 0 6px}.game-head p{margin:0;color:var(--muted)}.game-phase{display:none}.game-phase.visible{display:block;animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.jeopardy{display:grid;grid-template-columns:minmax(120px,200px) repeat(6,minmax(55px,1fr));gap:9px}.topic,.point,.topic-card{border-radius:10px;border:1px solid #393552;background:var(--panel);padding:12px;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center}.topic{font-weight:700}.point{background:var(--panel2);color:var(--gold);font:700 20px var(--serif);min-height:64px}.point:disabled{color:#625d77;background:var(--used)}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.topic-card{min-height:120px;display:block;font:700 21px var(--serif);cursor:pointer}.topic-card:hover,.point:not(:disabled):hover{border-color:var(--gold);filter:brightness(1.14)}.progress{display:block;color:var(--muted);font:13px var(--sans);margin-top:8px}.nav{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}.overlay{position:fixed;inset:0;z-index:10;background:#0b0a12ed;display:none;align-items:center;justify-content:center;padding:24px}.overlay.show{display:flex}.question-modal{width:min(800px,100%);text-align:center}.tag{display:inline-block;color:var(--gold);border:1px solid #a3792a;border-radius:99px;padding:5px 14px;margin-bottom:16px}.q-label{color:var(--muted);font-size:13px;margin:8px}.q-text{font:600 clamp(24px,4vw,38px)/1.4 var(--serif);white-space:pre-line;margin:18px 0 26px}.q-text.answer{color:var(--teal)}.hint{color:var(--muted)}.media{max-width:min(100%,650px);max-height:48vh;border-radius:10px;margin:10px auto;display:block}.editor-view{display:block}.game-view{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#242139;border:1px solid #55506f;padding:10px 16px;border-radius:9px;z-index:20;display:none}.toast.show{display:block}@media(max-width:700px){.topbar{padding:12px}.brand{font-size:14px}.grid,.settings-grid{grid-template-columns:1fr}.phase-head{grid-template-columns:1fr}.jeopardy{grid-template-columns:minmax(84px,1fr) repeat(3,minmax(48px,1fr))}.topic:nth-child(n){font-size:12px}.point{min-height:48px;font-size:15px}.topic-grid{grid-template-columns:1fr}.wrap{padding:20px 12px 40px}}
</style></head><body>
<nav class="topbar"><div class="brand">Գիտելիքների Մենամարտ · Խմբագրիչ</div><div class="actions"><button class="btn" id="playBtn">▶ Խաղի նախադիտում</button><button class="btn" id="saveBtn">Պահպանել</button><button class="btn primary" id="exportBtn">Ներբեռնել խաղը</button><button class="btn" id="lockBtn">Կողպել</button></div></nav>
<div id="loginGate" style="position:fixed;inset:0;z-index:30;background:#100e19;display:flex;align-items:center;justify-content:center;padding:20px"><form id="loginForm" class="panel" style="width:min(420px,100%)"><h2>Ադմինի մուտք</h2><p style="color:var(--muted)">Խմբագրիչը բացելու համար մուտքագրեք գաղտնաբառը։</p><label class="field">Գաղտնաբառ<input id="loginPassword" type="password" autocomplete="current-password" required autofocus></label><p id="loginError" style="color:#ff9d9d;display:none">Սխալ գաղտնաբառ։</p><button class="btn primary" style="margin-top:14px;width:100%">Մուտք գործել</button><p style="font-size:12px;color:var(--muted);margin-bottom:0">Առաջին մուտքի գաղտնաբառը՝ <strong>admin123</strong>։ Փոխեք այն ստորև՝ կարգավորումներում։</p></form></div>
<main class="wrap editor-view" id="editor"><div class="tabs"><button class="btn tab active" data-tab="content">Փուլեր և հարցեր</button><button class="btn tab" data-tab="design">Գույներ և տառատեսակներ</button></div>
<section id="contentTab"><div class="panel"><div class="grid"><label class="field">Խաղի վերնագիր<input id="titleInput"></label><label class="field">Հարցերի միավորները (բաժանեք ստորակետով)<input id="pointsInput" placeholder="100, 200, 300, 400, 500, 600"></label></div></div><div id="phases"></div><button class="btn primary" id="addPhase">＋ Ավելացնել փուլ</button></section>
<section id="designTab" class="hidden"><div class="panel"><h2>Գույներ և տառատեսակներ</h2><div class="settings-grid"><label class="field">Ֆոն<div class="color-field"><input type="color" data-color="bg"><input type="text" data-color-text="bg"></div></label><label class="field">Վահանակ<div class="color-field"><input type="color" data-color="panel"><input type="text" data-color-text="panel"></div></label><label class="field">Վերնագրի գույն<div class="color-field"><input type="color" data-color="gold"><input type="text" data-color-text="gold"></div></label><label class="field">Հիմնական տեքստ<div class="color-field"><input type="color" data-color="ink"><input type="text" data-color-text="ink"></div></label><label class="field">Պատասխանի գույն<div class="color-field"><input type="color" data-color="teal"><input type="text" data-color-text="teal"></div></label><label class="field">Օժանդակ տեքստ<div class="color-field"><input type="color" data-color="muted"><input type="text" data-color-text="muted"></div></label><label class="field">Տառատեսակ<select id="fontInput"><option value="Noto Sans Armenian">Noto Sans Armenian</option><option value="Noto Serif Armenian">Noto Serif Armenian</option><option value="Arial">Arial</option><option value="sans-serif">Համակարգային sans-serif</option></select></label><label class="field">Փոխել ադմինի գաղտնաբառը<input id="newPassword" type="password" autocomplete="new-password" placeholder="Նոր գաղտնաբառը՝ առնվազն 6 նիշ"></label></div></div></section></main>
<main class="game-wrap game-view" id="game"><button class="btn" id="editReturn">← Վերադառնալ խմբագրիչ</button><div id="gamePhases"></div><div class="nav" id="gameNav"></div></main><div class="overlay" id="overlay"><div class="question-modal"><div class="tag" id="modalTag"></div><div class="q-label" id="modalLabel">ՀԱՐՑ</div><img id="modalImage" class="media hidden"><video id="modalVideo" class="media hidden" controls></video><audio id="modalAudio" class="hidden" controls></audio><div id="modalText" class="q-text"></div><div id="modalHint" class="hint">Սեղմեք՝ պատասխանը տեսնելու համար</div><button class="btn primary hidden" id="modalNext">Փակել</button></div></div><div class="toast" id="toast"></div>
<script>
const defaults={title:'Գիտելիքների Մենամարտ',points:[100,200,300,400,500,600],theme:{bg:'#14121f',panel:'#1e1b30',gold:'#e8b23d',teal:'#4fd1c5',ink:'#f2efea',muted:'#9b96b3',font:'Noto Sans Armenian'},phases:[{name:'Փուլ 1',mode:'board',topics:[{name:'Թեմա 1',questions:Array.from({length:6},()=>({question:'',answer:''}))},{name:'Թեմա 2',questions:Array.from({length:6},()=>({question:'',answer:''}))},{name:'Թեմա 3',questions:Array.from({length:6},()=>({question:'',answer:''}))}]},{name:'Փուլ 2',mode:'topics',topics:[{name:'Թեմա 1',questions:Array.from({length:6},()=>({question:'',answer:''}))},{name:'Թեմա 2',questions:Array.from({length:6},()=>({question:'',answer:''}))}]},{name:'Փուլ 3',mode:'topics',topics:[{name:'Թեմա 1',questions:Array.from({length:6},()=>({question:'',answer:''}))}]}]};
let data;try{data=JSON.parse(localStorage.getItem('battleGameConfig'))||structuredClone(defaults)}catch{data=structuredClone(defaults)}let activeQuestion=null,gamePhase=0,topicIndex=0,questionIndex=0,answerShown=false,disabled=new Set();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applyTheme(){for(const k of ['bg','panel','gold','teal','ink','muted'])document.documentElement.style.setProperty('--'+k,data.theme[k]);document.documentElement.style.setProperty('--sans','"'+data.theme.font+'",sans-serif');$('#titleInput').value=data.title;$('#pointsInput').value=data.points.join(', ');$('#fontInput').value=data.theme.font;document.querySelectorAll('[data-color]').forEach(el=>el.value=data.theme[el.dataset.color]);document.querySelectorAll('[data-color-text]').forEach(el=>el.value=data.theme[el.dataset.colorText]);}
function renderEditor(){const host=$('#phases');host.innerHTML='';data.phases.forEach((p,pi)=>{const phase=document.createElement('article');phase.className='phase-card';phase.innerHTML=`<div class="phase-title"><h3>${esc(p.name||'Փուլ '+(pi+1))}</h3><div class="row-actions"><button class="btn" data-action="addTopic" data-p="${pi}">＋ Թեմա</button><button class="btn danger" data-action="removePhase" data-p="${pi}">Ջնջել փուլը</button></div></div><div class="question-list"><div class="phase-head"><label class="field">Փուլի անուն<input data-field="phaseName" data-p="${pi}" value="${esc(p.name)}"></label><label class="field">Ձևաչափ<select data-field="mode" data-p="${pi}"><option value="board" ${p.mode==='board'?'selected':''}>Միավորներով խաղատախտակ</option><option value="topics" ${p.mode==='topics'?'selected':''}>Թեմաներ՝ հաջորդական հարցերով</option></select></label></div><div class="topics" data-topics="${pi}"></div></div>`;const th=phase.querySelector('.topics');p.topics.forEach((t,ti)=>{const topic=document.createElement('div');topic.className='panel';topic.style.margin='14px 0 0';topic.innerHTML=`<div class="phase-head"><label class="field">Թեմայի անուն<input data-field="topicName" data-p="${pi}" data-t="${ti}" value="${esc(t.name)}"></label>${p.mode==='topics'?`<label class="field" style="display:flex;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" data-field="hideTopicName" data-p="${pi}" data-t="${ti}" ${t.hideName?'checked':''}> Թաքցնել խաղի ընթացքում</label>`:''}<div class="row-actions"><button class="btn" data-action="addQuestion" data-p="${pi}" data-t="${ti}">＋ Հարց</button><button class="btn danger" data-action="removeTopic" data-p="${pi}" data-t="${ti}">Ջնջել թեման</button></div></div><div class="questions"></div>`;const qhost=topic.querySelector('.questions');t.questions.forEach((q,qi)=>{const qel=document.createElement('div');qel.className='q-card';qel.innerHTML=`<div class="q-head"><span>Հարց ${qi+1}${p.mode==='board'&&data.points[qi]!=null?' · '+data.points[qi]+' միավոր':''}</span><button class="btn danger" data-action="removeQuestion" data-p="${pi}" data-t="${ti}" data-q="${qi}">Ջնջել</button></div><div class="grid"><label class="field">Հարց<textarea data-field="question" data-p="${pi}" data-t="${ti}" data-q="${qi}">${esc(q.question)}</textarea></label><label class="field">Պատասխան<textarea data-field="answer" data-p="${pi}" data-t="${ti}" data-q="${qi}">${esc(q.answer)}</textarea></label><label class="field">Հարցի նկարի/տեսանյութի/ձայնի ուղի<input data-field="media" data-p="${pi}" data-t="${ti}" data-q="${qi}" value="${esc(q.media||'')}" placeholder="images/question.jpg կամ audio/question.mp3"></label><label class="field">Պատասխանի մեդիայի ուղի<input data-field="answerMedia" data-p="${pi}" data-t="${ti}" data-q="${qi}" value="${esc(q.answerMedia||'')}" placeholder="images/answer.jpg"></label></div>`;qhost.appendChild(qel)});th.appendChild(topic)});host.appendChild(phase)});}
function save(){data.title=$('#titleInput').value||'Գիտելիքների Մենամարտ';const pts=$('#pointsInput').value.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(pts.length)data.points=pts;try{localStorage.setItem('battleGameConfig',JSON.stringify(data));const pass=$('#newPassword').value;if(pass){if(pass.length<6){toast('Գաղտնաբառը պետք է ունենա առնվազն 6 նիշ։');return}localStorage.setItem('battleAdminPassword',pass);$('#newPassword').value='';toast('Կարգավորումները և գաղտնաբառը պահպանվեցին։')}else toast('Կարգավորումները պահպանվեցին այս դիտարկիչում։')}catch{toast('Պահպանման սխալ։ Ներբեռնեք խաղը՝ պահուստ ունենալու համար։')}}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function renderGame(){const host=$('#gamePhases');host.innerHTML='';$('#gameNav').innerHTML='';data.phases.forEach((p,pi)=>{const section=document.createElement('section');section.className='game-phase'+(pi===gamePhase?' visible':'');section.dataset.phase=pi;section.innerHTML=`<header class="game-head"><h1>${esc(pi===0?data.title:p.name)}</h1><p>${esc(p.name)}</p></header><div class="game-content"></div>`;const content=section.querySelector('.game-content');if(p.mode==='board'){const board=document.createElement('div');board.className='jeopardy';p.topics.forEach((t,ti)=>{const label=document.createElement('div');label.className='topic';label.textContent=t.hideName?'Թեմա '+(ti+1):t.name;board.appendChild(label);for(let qi=0;qi<Math.min(data.points.length,t.questions.length);qi++){const b=document.createElement('button');b.className='point';b.textContent=data.points[qi];const key=`${pi}-${ti}-${qi}`;b.disabled=disabled.has(key);b.onclick=()=>openGameQ(pi,ti,qi,key);board.appendChild(b)}});content.appendChild(board)}else{const grid=document.createElement('div');grid.className='topic-grid';p.topics.forEach((t,ti)=>{const b=document.createElement('button');b.className='topic-card';const displayName=t.hideName?'Թեմա '+(ti+1):t.name;b.innerHTML=`${esc(displayName)}<span class="progress">${t.questions.length} հարց</span>`;b.onclick=()=>{topicIndex=ti;questionIndex=0;openGameQ(pi,ti,0,null)};grid.appendChild(b)});content.appendChild(grid)}const nav=document.createElement('div');nav.className='nav';if(pi>0){const back=document.createElement('button');back.className='btn';back.textContent='← Նախորդ փուլ';back.onclick=()=>{gamePhase=pi-1;renderGame()};nav.appendChild(back)}if(pi<data.phases.length-1){const next=document.createElement('button');next.className='btn primary';next.textContent='Հաջորդ փուլ →';next.onclick=()=>{gamePhase=pi+1;renderGame();window.scrollTo(0,0)};nav.appendChild(next)}content.appendChild(nav);host.appendChild(section)})}
function openGameQ(pi,ti,qi,key){activeQuestion={pi,ti,qi,key};answerShown=false;const q=data.phases[pi].topics[ti].questions[qi]||{};$('#modalTag').textContent=data.phases[pi].topics[ti].name+(data.phases[pi].mode==='board'?' · '+data.points[qi]:' · '+(qi+1)+'/'+data.phases[pi].topics[ti].questions.length);$('#modalLabel').textContent='ՀԱՐՑ';$('#modalText').textContent=q.question||'(Հարցը լրացված չէ)';$('#modalText').className='q-text';$('#modalHint').classList.remove('hidden');$('#modalNext').classList.add('hidden');setMedia(q.media);$('#overlay').classList.add('show')}
function setMedia(src){['modalImage','modalVideo','modalAudio'].forEach(id=>{const e=$('#'+id);e.classList.add('hidden');if(e.tagName!=='IMG'){e.pause();e.removeAttribute('src');e.load()}});if(!src)return;const ext=src.split('.').pop().toLowerCase();const id=['mp3','wav','ogg','m4a'].includes(ext)?'modalAudio':['mp4','webm','mov'].includes(ext)?'modalVideo':'modalImage';$('#'+id).src=src;$('#'+id).classList.remove('hidden')}
function reveal(){if(!activeQuestion||answerShown)return;answerShown=true;const q=data.phases[activeQuestion.pi].topics[activeQuestion.ti].questions[activeQuestion.qi]||{};$('#modalLabel').textContent='ՊԱՏԱՍԽԱՆ';$('#modalText').textContent=q.answer||'(Պատասխանը լրացված չէ)';$('#modalText').className='q-text answer';$('#modalHint').classList.add('hidden');setMedia(q.answerMedia);$('#modalNext').textContent=data.phases[activeQuestion.pi].mode==='board'?'Փակել':'Հաջորդ հարցը';$('#modalNext').classList.remove('hidden')}
function closeQuestion(){if(activeQuestion?.key)disabled.add(activeQuestion.key);$('#overlay').classList.remove('show');activeQuestion=null;renderGame()}
$('#overlay').onclick=e=>{if(e.target===$('#overlay'))reveal()};$('#modalHint').onclick=reveal;$('#modalNext').onclick=()=>{if(!activeQuestion)return;const p=data.phases[activeQuestion.pi],t=p.topics[activeQuestion.ti];if(p.mode==='topics'&&activeQuestion.qi<t.questions.length-1){const {pi,ti}=activeQuestion;$('#overlay').classList.remove('show');openGameQ(pi,ti,activeQuestion.qi+1,null)}else closeQuestion()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,p,t,q}=b.dataset,pi=+p,ti=+t,qi=+q;if(action==='addTopic')data.phases[pi].topics.push({name:'Նոր թեմա',questions:[{question:'',answer:''}]});if(action==='removePhase'){if(data.phases.length<2)return toast('Խաղում պետք է մնա առնվազն մեկ փուլ։');data.phases.splice(pi,1)}if(action==='addQuestion')data.phases[pi].topics[ti].questions.push({question:'',answer:''});if(action==='removeTopic'){if(data.phases[pi].topics.length<2)return toast('Փուլում պետք է մնա առնվազն մեկ թեմա։');data.phases[pi].topics.splice(ti,1)}if(action==='removeQuestion'){if(data.phases[pi].topics[ti].questions.length<2)return toast('Թեմայում պետք է մնա առնվազն մեկ հարց։');data.phases[pi].topics[ti].questions.splice(qi,1)}renderEditor()});
document.addEventListener('input',e=>{const el=e.target,field=el.dataset.field;if(field){const p=+el.dataset.p,t=+el.dataset.t,q=+el.dataset.q;if(field==='phaseName')data.phases[p].name=el.value;if(field==='mode')data.phases[p].mode=el.value;if(field==='topicName')data.phases[p].topics[t].name=el.value;if(['question','answer','media','answerMedia'].includes(field)){const k={media:'media',answerMedia:'answerMedia'}[field]||field;data.phases[p].topics[t].questions[q][k]=el.value}}if(el.id==='titleInput')data.title=el.value;if(el.dataset.colorText){const k=el.dataset.colorText;data.theme[k]=el.value;if(/^#[0-9a-f]{6}$/i.test(el.value))applyTheme()} });
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.color){data.theme[el.dataset.color]=el.value;applyTheme()}if(el.id==='fontInput'){data.theme.font=el.value;applyTheme()}if(el.dataset.field==='mode'){data.phases[+el.dataset.p].mode=el.value;renderEditor()}if(el.dataset.field==='hideTopicName'){data.phases[+el.dataset.p].topics[+el.dataset.t].hideName=el.checked}});
$('#addPhase').onclick=()=>{data.phases.push({name:'Նոր փուլ',mode:'topics',topics:[{name:'Թեմա 1',questions:[{question:'',answer:''}]}]});renderEditor()};$('#saveBtn').onclick=save;$('#playBtn').onclick=()=>{save();$('#editor').style.display='none';$('#game').style.display='block';gamePhase=0;renderGame();window.scrollTo(0,0)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').classList.contains('show'))closeQuestion();if(e.key===' '&&$('#overlay').classList.contains('show')){e.preventDefault();reveal()}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('#contentTab').classList.toggle('hidden',b.dataset.tab!=='content');$('#designTab').classList.toggle('hidden',b.dataset.tab!=='design')});
$('#editReturn').onclick=()=>{ $('#game').style.display='none';$('#editor').style.display='block';window.scrollTo(0,0)};$('#exportBtn').onclick=()=>{save();const clone=document.documentElement.cloneNode(true);clone.querySelector('#loginGate')?.remove();clone.querySelector('.topbar')?.remove();clone.querySelector('#editor')?.remove();clone.querySelector('#game').style.display='block';clone.querySelector('#editReturn')?.remove();const scr=clone.querySelector('script');scr.textContent=scr.textContent.replace(/let data;try\{data=JSON\.parse\(localStorage\.getItem\('battleGameConfig'\)\).*?let activeQuestion=/s,'let data='+JSON.stringify(data)+';let activeQuestion=');scr.textContent=scr.textContent.replace('applyTheme();renderEditor();','applyTheme();renderGame();');const html='<!doctype html>\n'+clone.outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='battle-of-knowledge.html';a.click();URL.revokeObjectURL(a.href);toast('Ներբեռնվեց պատրաստի խաղի HTML ֆայլը։')};
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const wanted=localStorage.getItem('battleAdminPassword')||'admin123';if($('#loginPassword').value===wanted){$('#loginGate').remove()}else{$('#loginError').style.display='block';$('#loginPassword').select()}});$('#lockBtn').onclick=()=>location.reload();
applyTheme();renderEditor();
</script></body></html>
