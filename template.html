<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Հարց ու պատասխան խաղ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14121f;
    --panel: #1e1b30;
    --panel-2: #262242;
    --gold: #e8b23d;
    --gold-dim: #a3792a;
    --teal: #4fd1c5;
    --ink: #f2efea;
    --muted: #9b96b3;
    --used: #2a2740;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: radial-gradient(circle at 20% -10%, #241f3d 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: "Noto Sans Armenian", sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  header{
    text-align:left;
    margin-bottom: 36px;
    border-bottom: 1px solid #332f52;
    padding-bottom: 20px;
  }
  header h1{
    font-family: "Noto Serif Armenian", serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 6px;
    color: var(--gold);
  }
  header p{
    margin:0;
    color: var(--muted);
    font-size: 15px;
  }
  .board{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .row{
    display:grid;
    grid-template-columns: 200px repeat(6, 1fr);
    gap: 10px;
    align-items:stretch;
  }
  .topic{
    display:flex;
    align-items:center;
    background: var(--panel);
    border: 1px solid #332f52;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.3;
  }
  .point-btn{
    background: var(--panel-2);
    border: 1px solid #3a355c;
    border-radius: 10px;
    color: var(--gold);
    font-family: "Noto Serif Armenian", serif;
    font-weight: 700;
    font-size: 20px;
    padding: 18px 0;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .point-btn:hover{
    background: #322c56;
    border-color: var(--gold-dim);
    transform: translateY(-2px);
  }
  .point-btn:disabled{
    background: var(--used);
    border-color: #2a2740;
    color: #55506f;
    cursor: default;
    transform:none;
  }

  .phase2-wrap{
    border-top: 1px solid #332f52;
    padding-top: 40px;
  }
  .stage-section{
    display: none;
  }
  .stage-section.visible{
    display: block;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(12px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .continue-btn{
    display:block;
    margin: 32px auto 0;
    background: var(--gold);
    color: #241a08;
    border: none;
    border-radius: 10px;
    padding: 14px 32px;
    font-family: "Noto Sans Armenian", sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .continue-btn:hover{
    background: #f2c25c;
    transform: translateY(-2px);
  }
  .nav-row{
    display:flex;
    justify-content:center;
    gap: 14px;
    flex-wrap:wrap;
  }
  .nav-row .continue-btn{
    margin-left:0;
    margin-right:0;
  }
  .back-btn{
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid #3a355c;
  }
  .back-btn:hover{
    background: #322c56;
    border-color: var(--gold-dim);
  }
  .phase2-board{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .phase2-btn{
    background: var(--panel);
    border: 1px solid #332f52;
    border-radius: 14px;
    padding: 34px 20px;
    text-align:center;
    cursor: pointer;
    font-family: "Noto Serif Armenian", serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .phase2-btn .progress{
    display:block;
    margin-top: 10px;
    font-family: "Noto Sans Armenian", sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--muted);
  }
  .phase2-btn:hover{
    background: #322c56;
    border-color: var(--gold-dim);
    transform: translateY(-2px);
  }
  .phase2-btn.done{
    background: var(--used);
    border-color: #2a2740;
    color: #55506f;
    cursor: default;
    transform:none;
  }
  .phase2-btn.done .progress{ color: #4a4666; }

  @media (max-width: 720px){
    .phase2-board{ grid-template-columns: 1fr; }
  }

  /* Overlay */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(10,9,18,.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 32px;
    cursor: pointer;
    z-index: 50;
  }
  .overlay.show{ display:flex; }
  .card{
    max-width: 780px;
    width:100%;
    text-align:center;
    cursor: default;
  }
  .card .label{
    font-size: 14px;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .card .points-tag{
    display:inline-block;
    color: var(--gold);
    font-family: "Noto Serif Armenian", serif;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 18px;
    border: 1px solid var(--gold-dim);
    border-radius: 999px;
    padding: 4px 16px;
  }
  .card-img{
    display:block;
    max-width: 100%;
    max-height: 46vh;
    border-radius: 12px;
    margin: 0 auto 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
  }
  .card-video{
    display:block;
    max-width: 100%;
    max-height: 50vh;
    border-radius: 12px;
    margin: 0 auto 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
  }
  .card-audio{
    display:block;
    width: 100%;
    max-width: 460px;
    margin: 10px auto 26px;
  }
  .card .text{
    font-family: "Noto Serif Armenian", serif;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 600;
    line-height: 1.4;
    white-space: pre-line;
    margin-bottom: 26px;
  }
  .card .text.answer{ color: var(--teal); }
  .card .hint{
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .card .close-btn{
    margin-top: 10px;
    background: var(--teal);
    color: #0e2523;
    border: none;
    border-radius: 8px;
    padding: 10px 26px;
    font-family: "Noto Sans Armenian", sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  @media (max-width: 720px){
    .row{ grid-template-columns: 120px repeat(6, 1fr); }
    .topic{ font-size: 12px; padding: 0 8px; }
    .point-btn{ font-size: 15px; padding: 12px 0; }
  }
</style>

const POINT_VALUES = [100, 200, 300, 400, 500, 600];

document.getElementById("gameTitle").textContent = GAME_TITLE;

const card = document.getElementById("card");

const pointsTag = document.getElementById("pointsTag");
const stageLabel = document.getElementById("stageLabel");
const hint = document.getElementById("hint");
const closeBtn = document.getElementById("closeBtn");

let currentBtn = null;
let currentItem = null;
let showingAnswer = false;

const MEDIA_VOLUME_BOOST = 10;
const audioContextCache = new WeakMap();

function boostMediaVolume(element){
  if (!element) return;

  element.muted = false;
  const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextCtor) {
    element.volume = Math.min(1, (element.volume || 1) * MEDIA_VOLUME_BOOST);
    return;
  }

  let ctx = audioContextCache.get(element);
  if (!ctx){
    ctx = new AudioContextCtor();
    const source = ctx.createMediaElementSource(element);
    const gainNode = ctx.createGain();
    gainNode.gain.value = MEDIA_VOLUME_BOOST;
    source.connect(gainNode);
    gainNode.connect(ctx.destination);
    audioContextCache.set(element, ctx);
  }

  if (ctx.state === "suspended") {
    ctx.resume();
  }
}

GAME_DATA.forEach((topicData) => {
  const row = document.createElement("div");
  row.className = "row";

  const topicEl = document.createElement("div");
  topicEl.className = "topic";
  topicEl.textContent = topicData.topic;
  row.appendChild(topicEl);

  POINT_VALUES.forEach((pts) => {
    const btn = document.createElement("button");
    btn.className = "point-btn";
    btn.textContent = pts;
    btn.addEventListener("click", () => openQuestion(topicData, pts, btn));
    row.appendChild(btn);
  });

  board.appendChild(row);
});

function openQuestion(topicData, pts, btn){
  currentItem = topicData.questions[pts];
  currentBtn = btn;
  showingAnswer = false;

  pointsTag.textContent = topicData.topic + " · " + pts;
  stageLabel.textContent = "ՀԱՐՑ";
  cardText.classList.remove("answer");
  hint.style.display = "block";
  closeBtn.style.display = "none";

  const cardImg = document.getElementById("cardImg");
  const cardVideo = document.getElementById("cardVideo");
  const cardAudio = document.getElementById("cardAudio");
  const hasImage = currentItem && currentItem.image;
  const hasVideo = currentItem && currentItem.video;
  const hasAudio = currentItem && currentItem.audio;

  cardImg.style.display = "none";
  cardImg.src = "";
  cardVideo.pause();
  cardVideo.style.display = "none";
  cardVideo.removeAttribute("src");
  cardVideo.load();
  cardAudio.pause();
  cardAudio.style.display = "none";
  cardAudio.removeAttribute("src");
  cardAudio.load();

  if (hasVideo){
    cardVideo.src = currentItem.video;
    cardVideo.style.display = "block";
    cardText.textContent = "";
    cardText.style.display = "none";
    boostMediaVolume(cardVideo);
  } else if (hasAudio){
    cardAudio.src = currentItem.audio;
    cardAudio.load();
    cardAudio.style.display = "block";
    cardText.textContent = "";
    cardText.style.display = "none";
  } else if (hasImage){
    cardImg.src = currentItem.image;
    cardImg.style.display = "block";
    cardText.textContent = "";
    cardText.style.display = "none";
  } else {
    cardText.style.display = "block";
    cardText.textContent = currentItem ? currentItem.question : "(հարցը լրացված չէ)";
  }

  overlay.classList.add("show");
}

function revealAnswer(){
  showingAnswer = true;
  stageLabel.textContent = "ՊԱՏԱՍԽԱՆ";
  document.getElementById("cardVideo").pause();
  const cardAudio = document.getElementById("cardAudio");
  cardAudio.pause();
  const cardImg = document.getElementById("cardImg");
  if (currentItem && currentItem.answerImage){
    cardImg.src = currentItem.answerImage;
    cardImg.style.display = "block";
  }
  if (currentItem && currentItem.answerAudio){
    cardAudio.src = currentItem.answerAudio;
    cardAudio.load();
    cardAudio.style.display = "block";
    cardText.style.display = "block";
    cardText.textContent = currentItem.answer;
  } else {
    cardAudio.style.display = "none";
    cardAudio.removeAttribute("src");
    cardAudio.load();
    cardText.style.display = "block";
    cardText.textContent = currentItem ? currentItem.answer : "(պատասխանը լրացված չէ)";
  }
  cardText.classList.add("answer");
  hint.style.display = "none";
  closeBtn.style.display = "inline-block";
}

function closeOverlay(){
  overlay.classList.remove("show");
  if (currentBtn){
    currentBtn.disabled = true;
  }
  currentBtn = null;
  currentItem = null;
}

overlay.addEventListener("click", (e) => {
  if (!showingAnswer){
    revealAnswer();
  }
});

document.getElementById("cardVideo").addEventListener("click", (e) => {
  e.stopPropagation();
});

document.getElementById("cardAudio").addEventListener("click", (e) => {

});

document.getElementById("continueToPhase2").addEventListener("click", () => {
  document.getElementById("phase1Section").classList.remove("visible");
  const section = document.getElementById("phase2Section");

});

document.getElementById("backToPhase1").addEventListener("click", () => {

});

closeBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  closeOverlay();
});

PHASE2_DATA.forEach((topicData) => {
  const btn = document.createElement("div");
  btn.className = "phase2-btn";
  btn.innerHTML = topicData.topic + '<span class="progress">0/' + topicData.questions.length + '</span>';
  btn.addEventListener("click", () => openPhase2Topic(topicData, btn));
  phase2Board.appendChild(btn);
});

function openPhase2Topic(topicData, btn){
  p2Topic = topicData;
  p2Btn = btn;
  p2Index = 0;
  showPhase2Question();
  overlay2.classList.add("show");
}

function showPhase2Question(){
  p2ShowingAnswer = false;
  const item = p2Topic.questions[p2Index];
  phase2Tag.textContent = p2Topic.topic + " · " + (p2Index + 1) + "/" + p2Topic.questions.length;
  phase2StageLabel.textContent = "ՀԱՐՑ";
  phase2Text.classList.remove("answer");
  phase2Hint.style.display = "block";
  phase2CloseBtn.style.display = "none";

  const phase2Video = document.getElementById("phase2Video");
  phase2Video.pause();
  phase2Video.removeAttribute("src");
  phase2Video.load();

  if (item.video){
    phase2Video.src = item.video;
    phase2Video.style.display = "block";
    phase2Text.textContent = "";
    phase2Text.style.display = "none";
    boostMediaVolume(phase2Video);
  } else {
    phase2Video.style.display = "none";
    phase2Text.style.display = "block";
    phase2Text.textContent = item.question;
  }
}

function revealPhase2Answer(){
  p2ShowingAnswer = true;
  const item = p2Topic.questions[p2Index];
  const phase2Video = document.getElementById("phase2Video");
  phase2Video.pause();
  phase2StageLabel.textContent = "ՊԱՏԱՍԽԱՆ";
  phase2Text.style.display = "block";
  phase2Text.textContent = item.answer;
  phase2Text.classList.add("answer");
  phase2Hint.style.display = "none";
  const isLast = p2Index === p2Topic.questions.length - 1;
  phase2CloseBtn.textContent = isLast ? "Փակել և վերադառնալ" : "Հաջորդ հարց";
  phase2CloseBtn.style.display = "inline-block";
}

function advancePhase2(){
  const btnProgress = p2Btn.querySelector(".progress");
  btnProgress.textContent = (p2Index + 1) + "/" + p2Topic.questions.length;

  if (p2Index < p2Topic.questions.length - 1){
    p2Index++;
    showPhase2Question();
  } else {
    p2Btn.classList.add("done");
    overlay2.classList.remove("show");
    p2Topic = null;
    p2Btn = null;
  }
}

overlay2.addEventListener("click", () => {
  if (!p2ShowingAnswer){
    revealPhase2Answer();
  }
});

document.getElementById("phase2Video").addEventListener("click", (e) => {
  e.stopPropagation();
});

phase2CloseBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  advancePhase2();
});
